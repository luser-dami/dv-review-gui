<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>dv · Diversion Review</title>
<link rel="stylesheet" href="/vendor/github.min.css">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --border: #e3e6ea; --border-strong: #cfd4da;
    --text: #1c1e21; --dim: #656c76; --accent: #0b66d0; --accent-soft: #e8f1fc;
    --green: #1a7f37; --green-soft: #e6f4ea; --yellow: #9a6700; --yellow-soft: #fff3d6;
    --red: #c93c37; --red-soft: #fdebea; --blue: #0550ae; --blue-soft: #e7f0fb;
    --mono: "JetBrains Mono", Consolas, "Cascadia Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 14px/1.55 "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 10px; padding: 10px 18px;
    background: var(--panel); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 5;
  }
  i.sign { display: inline-block; width: 14px; font-style: normal; user-select: none; opacity: .7; }
  .add i.sign { color: var(--green); }
  .del i.sign { color: var(--red); }
  .fileblock { margin-bottom: 14px; }
  .diffhead {
    position: sticky; top: 0; z-index: 3;
    display: flex; align-items: center; gap: 10px;
    padding: 6px 12px; background: #eef1f5;
    border: 1px solid var(--border); border-bottom: none;
    border-radius: 10px 10px 0 0;
  }
  .diffhead .path { flex: 1; font-weight: 600; }
  .diffcard { background: var(--panel); border: 1px solid var(--border); border-radius: 0 0 10px 10px; overflow: hidden; }
  .st { font-family: var(--mono); font-size: 11px; white-space: nowrap; }
  .st .p { color: var(--green); font-weight: 600; }
  .st .m { color: var(--red); font-weight: 600; }
  .hunkband { background: var(--accent-soft); color: var(--accent); font-family: var(--mono); font-size: 11.5px; padding: 3px 12px; border-top: 1px solid var(--border); }
  .diffbody > .hunkband:first-child { border-top: none; }
  .dl { display: flex; align-items: flex-start; font-family: var(--mono); font-size: 12px; line-height: 1.7; border-left: 3px solid transparent; }
  .dl:hover { background: #f2f6fb; }
  .dl.add { background: var(--green-soft); border-left-color: var(--green); }
  .dl.del { background: var(--red-soft); border-left-color: var(--red); }
  .dl .ln { flex: 0 0 44px; text-align: right; padding-right: 8px; color: var(--dim); user-select: none; font-size: 11px; background: rgba(0,0,0,.028); border-right: 1px solid var(--border); }
  .dl .ln + .ln { margin-right: 4px; }
  .dl .sign { flex: 0 0 14px; text-align: center; font-style: normal; user-select: none; }
  .dl.add .sign { color: var(--green); }
  .dl.del .sign { color: var(--red); }
  .dl .code { white-space: pre-wrap; word-break: break-all; flex: 1; padding-right: 6px; }
  button.rv { visibility: hidden; flex: 0 0 26px; margin-right: 8px; border: none; background: none; color: var(--dim); cursor: pointer; font-size: 13px; padding: 0; border-radius: 5px; }
  .dl:hover button.rv { visibility: visible; }
  .dl button.rv:hover { color: var(--red); background: var(--red-soft); }
  button:disabled { opacity: .55; cursor: default; }
  button:focus-visible, .file-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .diffnav { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .diffnav .cur { font-family: var(--mono); font-size: 12.5px; font-weight: 600; flex: 1; word-break: break-all; }
  #toast { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 50; }
  #toast div { background: #24292f; color: #fff; border-radius: 8px; padding: 8px 14px; font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.18); animation: toastin .18s ease-out; }
  @keyframes toastin { from { transform: translateY(8px); opacity: 0; } }
  .file-row .path { flex: 1; }
  .file-row .st { margin-left: auto; }
  header .brand { font-weight: 700; font-size: 15px; }
  header .brand span { color: var(--accent); }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--panel2, #f0f2f5); border: 1px solid var(--border);
    border-radius: 999px; padding: 2px 12px; font-size: 12.5px;
  }
  .chip b { font-weight: 600; }
  .chip .mono { font-family: var(--mono); font-size: 11.5px; color: var(--dim); }
  .chip.ok { background: var(--green-soft); border-color: #bfe3c8; color: var(--green); }
  .chip.dirty { background: var(--yellow-soft); border-color: #ecd9a0; color: var(--yellow); }
  header button, .btn {
    background: var(--panel); color: var(--text); border: 1px solid var(--border-strong);
    border-radius: 7px; padding: 5px 14px; cursor: pointer; font: inherit; font-size: 13px;
  }
  header button:hover, .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); color: #fff; }
  .btn.green { border-color: var(--green); color: var(--green); }
  .btn.yellow { border-color: var(--yellow); color: var(--yellow); }
  .btn.red { border-color: var(--red); color: var(--red); }
  main { flex: 1; display: flex; min-height: 0; }
  aside {
    width: 400px; min-width: 320px; border-right: 1px solid var(--border);
    background: var(--panel); overflow-y: auto; padding: 14px;
  }
  #content { flex: 1; overflow-y: auto; padding: 18px 22px; }
  h2 {
    font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
    color: var(--dim); margin: 18px 0 8px;
  }
  h2:first-child { margin-top: 0; }
  h3 { font-size: 16px; margin: 0 0 4px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  .card.click { cursor: pointer; }
  .card.click:hover { border-color: var(--accent); background: #fafcfe; }
  .card.active { border-color: var(--accent); background: var(--accent-soft); }
  .empty { color: var(--dim); background: var(--panel); border: 1px dashed var(--border-strong); border-radius: 10px; padding: 14px; text-align: center; }
  .empty.ok { color: var(--green); background: var(--green-soft); border-style: solid; border-color: #bfe3c8; }
  .file-row {
    display: flex; align-items: baseline; gap: 8px; padding: 4px 8px;
    border-radius: 6px; cursor: pointer;
  }
  .file-row:hover { background: var(--accent-soft); }
  .file-row.active { background: var(--accent-soft); }
  .badge {
    flex: 0 0 18px; text-align: center; font-weight: 700; font-size: 11px;
    border-radius: 4px; font-family: var(--mono);
  }
  .badge.A { color: var(--green); background: var(--green-soft); }
  .badge.M { color: var(--yellow); background: var(--yellow-soft); }
  .badge.D { color: var(--red); background: var(--red-soft); }
  .badge.R { color: var(--blue); background: var(--blue-soft); }
  .path { font-family: var(--mono); font-size: 12px; color: var(--text); word-break: break-all; }
  .status-badge { font-weight: 600; }
  .status-badge.A { color: var(--green); } .status-badge.M { color: var(--yellow); }
  .status-badge.D { color: var(--red); } .status-badge.R { color: var(--blue); }
  .rchip {
    display: inline-flex; align-items: center; gap: 6px; border-radius: 999px;
    padding: 2px 10px; font-size: 12px; border: 1px solid var(--border); margin: 0 6px 6px 0;
    background: var(--panel);
  }
  .rchip.approved { border-color: #bfe3c8; background: var(--green-soft); color: var(--green); }
  .rchip.changes_requested { border-color: #ecd9a0; background: var(--yellow-soft); color: var(--yellow); }
  .rchip.rejected { border-color: #f1b8b4; background: var(--red-soft); color: var(--red); }
  .rchip.requested { color: var(--dim); }
  .meta { color: var(--dim); font-size: 12.5px; }
  .commit-row { display: flex; gap: 10px; padding: 7px 4px; border-bottom: 1px solid var(--border); align-items: baseline; }
  .commit-row:last-child { border-bottom: none; }
  .commit-id { font-family: var(--mono); font-size: 11.5px; color: var(--accent); background: var(--accent-soft); border-radius: 5px; padding: 1px 8px; white-space: nowrap; }
  #diff pre {
    margin: 0; font-family: var(--mono); font-size: 12px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-all;
  }
  #diff .add { color: var(--green); background: var(--green-soft); display: block; border-radius: 3px; }
  #diff .del { color: var(--red); background: var(--red-soft); display: block; border-radius: 3px; }
  #diff .hunk { color: var(--accent); background: var(--accent-soft); display: block; border-radius: 3px; }
  #diff .filehead { font-weight: 700; display: block; margin-top: 8px; }
  .comment { border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; background: var(--panel); }
  .comment .meta { margin-bottom: 2px; }
  textarea {
    width: 100%; min-height: 64px; background: var(--panel); color: var(--text);
    border: 1px solid var(--border-strong); border-radius: 8px; padding: 8px 10px;
    font: inherit; resize: vertical;
  }
  textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  .banner { margin: 10px 18px 0; }
  .banner:empty { margin: 0; }
  .banner div { border-radius: 8px; padding: 8px 14px; white-space: pre-wrap; border: 1px solid var(--red); background: var(--red-soft); color: var(--red); }
  .banner div.ok { border-color: #bfe3c8; background: var(--green-soft); color: var(--green); }
  .spin { color: var(--dim); }
  .desc { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin: 8px 0; }
  input[type="text"] {
    width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--border-strong);
    border-radius: 8px; padding: 7px 10px; font: inherit;
  }
</style>
</head>
<body>
<header>
  <span class="brand">dv<span> · review</span></span>
  <span id="chips"><span class="chip">加载中…</span></span>
  <span style="flex:1"></span>
  <button onclick="refreshAll()">刷新（R）</button>
</header>
<div class="banner" id="banner"></div>
<main>
  <aside>
    <h2>待提交变更</h2>
    <div id="changes"><span class="spin">加载中…</span></div>
    <h2>Open Reviews</h2>
    <div id="reviews"><span class="spin">加载中…</span></div>
    <button class="btn" style="width:100%" onclick="promptNewReview()">＋ 发起 Review（当前分支）</button>
    <h2>分支</h2>
    <div id="branches"><span class="spin">加载中…</span></div>
  </aside>
  <section id="content">
    <div id="home">
      <h2 id="home-title">提交历史</h2>
      <div class="card" id="log"><span class="spin">加载中…</span></div>
    </div>
    <div id="review-pane" style="display:none"></div>
  </section>
</main>
<div id="toast"></div>
<script src="/vendor/highlight.min.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const STATUS_LABEL = { A: "新增", M: "修改", D: "删除", R: "重命名" };
let reviews = [];
let currentId = null;
let currentReview = null;
let info = null;
let lastState = null;
/** Client mirror of the server-side workspace-diff model. */
let wsModel = null;      // { files, atClient }
let wsViewPath = null;   // null = all changed files
let wsDiffOpen = false;  // workspace diff view currently on screen
const WS_TTL = 30_000;   // mirrors the server cache TTL
// Stamped by the serving process; a literal placeholder means an outdated
// server served this page (its API model lacks the fields this UI needs).
const SERVER_VERSION = "%DV_GUI_VERSION%";

function banner(text, ok) {
  $("banner").innerHTML = text ? `<div class="${ok ? "ok" : ""}">${esc(text)}</div>` : "";
}

function toast(text) {
  const el = document.createElement("div");
  el.textContent = text;
  $("toast").appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(body.error || `HTTP ${res.status}`);
    err.stale = !!body.stale;
    throw err;
  }
  return body;
}

function statHtml(path) {
  const f = wsModel?.files.find((x) => x.path === path);
  if (!f) return "";
  let a = 0, d = 0;
  for (const h of f.hunks) for (const l of h.lines) {
    if (l.t === "+") a++;
    else if (l.t === "-") d++;
  }
  return `<span class="st"><span class="p">+${a}</span> <span class="m">−${d}</span></span>`;
}

function changeRows(changes) {
  if (!changes.length) return `<div class="empty ok">✓ 工作区干净，没有待提交的变更</div>`;
  const head = `<div style="display:flex;justify-content:flex-end;margin-bottom:4px">
    <button class="btn" style="font-size:12px;padding:2px 10px" onclick="showWorkspaceDiff()">查看全部 diff</button></div>`;
  return head + `<div class="card" style="padding:4px 6px">` + changes.map((c) =>
    `<div class="file-row" tabindex="0" data-path="${esc(c.path)}">
       <span class="badge ${esc(c.status)}" title="${esc(STATUS_LABEL[c.status] ?? c.status)}">${esc(c.status)}</span>
       <span class="path">${esc(c.path)}</span>${statHtml(c.path)}
     </div>`).join("") + `</div>`;
}


function branchRows(branches) {
  if (!branches.length) return `<div class="empty">没有分支信息</div>`;
  return branches.map((b) => {
    const current = info && info.branch === b.name;
    return `<div class="card" style="padding:8px 12px;${current ? "border-color:var(--accent);background:var(--accent-soft)" : ""}">
      <div><b>${esc(b.name)}</b>${current ? ' <span class="chip ok">当前</span>' : ""}</div>
      <div class="meta mono" style="font-family:var(--mono);font-size:11.5px">${esc(b.id)}${b.commit ? " · " + esc(b.commit) : ""}</div>
    </div>`;
  }).join("");
}

function reviewCards(items) {
  if (!items.length) return `<div class="empty">暂无 open review —— 在功能分支上点上方按钮发起</div>`;
  return items.map((r, i) => {
    const names = new Map((r.reviewers ?? []).map((u) => [u.id, u.full_name || u.name || u.email || u.id]));
    const chips = (r.reviewer_statuses ?? []).map((s) =>
      `<span class="rchip ${esc(s.status)}">${esc(names.get(s.user_id) ?? s.user_id)} · ${esc(s.status)}</span>`).join("");
    return `<div class="card click ${r.id === currentId ? "active" : ""}" onclick="openReview('${esc(r.id)}')">
      <div style="display:flex;gap:8px;align-items:baseline">
        <span class="commit-id">${esc(r.id.replace("dv.review.", "#"))}</span>
        <b style="font-size:14px">${esc(r.title)}</b>
      </div>
      <div class="meta" style="margin:2px 0 4px">
        <span class="path">${esc(r.compare_ref)}</span> → <span class="path">${esc(r.base_ref)}</span>
        · ${esc(r.author?.full_name || r.author?.name || "?")}
      </div>
      <div>${chips || '<span class="dim meta">尚无 reviewer 状态</span>'}</div>
    </div>`;
  }).join("");
}

function renderState(state) {
  info = state.info;
  const sync = info.clean
    ? '<span class="chip ok">✓ 已同步 · 工作区干净</span>'
    : '<span class="chip dirty">● 有未提交变更</span>';
  $("chips").innerHTML =
    `<span class="chip"><b>${esc(info.repo ?? "?")}</b><span class="mono">${esc(info.repoId ?? "")}</span></span>` +
    `<span class="chip"><b>${esc(info.branch ?? "?")}</b></span>` +
    `<span class="chip"><span class="mono">${esc(info.commit ?? "")}</span></span>` +
    `<span class="chip">工作区：${esc(info.workspace ?? "?")}</span>` + sync;
  lastState = state;
  renderChanges();
  $("branches").innerHTML = branchRows(state.branches);
  $("log").innerHTML = state.log.length
    ? state.log.map((c) => `<div class="commit-row"><span class="commit-id">${esc(c.id.replace("dv.commit.", ""))}</span><span>${esc(c.subject)}</span></div>`).join("")
    : '<span class="dim">没有提交</span>';
}

async function loadReviews() {
  const data = await api("/api/reviews");
  reviews = data.items ?? [];
  $("reviews").innerHTML = reviewCards(reviews);
}

function renderChanges() {
  if (lastState) $("changes").innerHTML = changeRows(lastState.changes);
}

function reviewerChips(r) {
  const names = new Map((r.reviewers ?? []).map((u) => [u.id, u.full_name || u.name || u.email || u.id]));
  return (r.reviewer_statuses ?? []).map((s) =>
    `<span class="rchip ${esc(s.status)}">${esc(names.get(s.user_id) ?? s.user_id)} · ${esc(s.status)}</span>`).join("");
}

async function openReview(id) {
  currentId = id;
  wsDiffOpen = false;
  banner("");
  const data = await api(`/api/review?id=${encodeURIComponent(id)}`);
  currentReview = data.review;
  const r = data.review;
  const who = (u) => esc(u?.full_name || u?.name || u?.email || u?.id || "?");
  const files = data.files.length
    ? `<div class="card" style="padding:4px 6px">` + data.files.map((c) =>
        `<div class="file-row" tabindex="0" data-rpath="${esc(c.path)}">
           <span class="badge ${esc(c.status)}" title="${esc(STATUS_LABEL[c.status] ?? c.status)}">${esc(c.status)}</span>
           <span class="path">${esc(c.path)}</span>
         </div>`).join("") + `</div>`
    : '<div class="empty">该 review 没有文件差异</div>';
  const comments = data.comments.length
    ? data.comments.map((cm) => `
        <div class="comment">
          <div class="meta"><b>${esc(who(cm.author))}</b>${cm.file_path ? ` 评论了 <span class="path">${esc(cm.file_path)}</span>` : ""} · ${new Date(cm.created_at * 1000).toISOString().slice(0, 16).replace("T", " ")}</div>
          <div>${esc(cm.content)}</div>
        </div>`).join("")
    : '<div class="empty">还没有评论</div>';
  $("home").style.display = "none";
  const pane = $("review-pane");
  pane.style.display = "block";
  pane.innerHTML = `
    <h3 style="display:flex;align-items:center;gap:10px">
      <span class="commit-id">${esc(r.id.replace("dv.review.", "#"))}</span> ${esc(r.title)}
    </h3>
    <div class="meta">
      <span class="path">${esc(r.compare_ref)}</span> → <span class="path">${esc(r.base_ref)}</span>
      · 作者 ${who(r.author)} · 更新于 ${new Date(r.updated_at * 1000).toISOString().slice(0, 16).replace("T", " ")}
    </div>
    ${r.description ? `<div class="desc">${esc(r.description)}</div>` : ""}
    <div style="margin:8px 0">${reviewerChips(r) || '<span class="meta">尚无 reviewer 状态</span>'}</div>
    <div class="actions">
      <button class="btn green" onclick="act('approved')">✓ 批准</button>
      <button class="btn yellow" onclick="act('changes_requested')">✎ 请求修改</button>
      <button class="btn red" onclick="act('rejected')">✗ 拒绝</button>
      <button class="btn primary" onclick="act('merge')">⇥ 合并到 ${esc(r.base_ref)}</button>
      <button class="btn" onclick="act('close')">关闭 review</button>
      <button class="btn" onclick="showDiff()">完整 diff</button>
    </div>
    <h2>变更文件（${data.files.length}，点击看 diff）</h2>
    ${files}
    <div id="diff" style="margin-top:10px"></div>
    <h2>评论（${data.comments.length}）</h2>
    <div id="commentlist">${comments}</div>
    <textarea id="newcomment" placeholder="写下评审意见…（将以你的账号发表）"></textarea>
    <div class="actions"><button class="btn primary" onclick="postComment()">发表评论</button></div>`;
  loadReviews();
}

const LANG_BY_EXT = {
  cpp: "cpp", cc: "cpp", cxx: "cpp", c: "c", h: "cpp", hpp: "cpp", hh: "cpp", inl: "cpp", hxx: "cpp",
  cs: "csharp", ini: "ini", cfg: "ini", inf: "ini", config: "ini",
  json: "json", uproject: "json", uplugin: "json",
  js: "javascript", mjs: "javascript", ts: "typescript", tsx: "typescript", jsx: "javascript",
  py: "python", xml: "xml", yaml: "yaml", yml: "yaml", md: "markdown", sh: "bash",
  lua: "lua", html: "xml", css: "css", sql: "sql", java: "java", go: "go", rs: "rust", rb: "ruby", php: "php",
};
function langOf(path) {
  const ext = (path.split(".").pop() || "").toLowerCase();
  return LANG_BY_EXT[ext] || "plaintext";
}
function hi(code, lang) {
  if (lang === "plaintext" || typeof hljs === "undefined") return esc(code);
  try {
    return hljs.highlight(code, { language: lang, ignoreIllegals: true }).value;
  } catch {
    return esc(code);
  }
}
function diffHtml(text) {
  let lang = "plaintext";
  return text.split("\n").map((l) => {
    if (l.startsWith("+++") || l.startsWith("---")) {
      const m = l.match(/^[+-]{3}\s+[ab]\/(.*)$/);
      if (m) lang = langOf(m[1]);
      return `<span class="filehead">${esc(l)}</span>`;
    }
    if (l.startsWith("@@")) return `<span class="hunk">${esc(l)}</span>`;
    if (l.startsWith("+") || l.startsWith("-")) {
      const sign = l[0];
      return `<span class="${sign === "+" ? "add" : "del"}"><i class="sign">${sign}</i>${hi(l.slice(1), lang)}</span>`;
    }
    return hi(l, lang);
  }).join("\n");
}

async function showDiff(path) {
  if (!currentReview) return;
  const q = new URLSearchParams({ base: currentReview.base_ref, compare: currentReview.compare_ref });
  if (path) q.set("path", path);
  const text = await fetch(`/api/diff?${q}`).then((r) => r.text());
  let box = $("diff");
  if (!box) { box = document.createElement("div"); box.id = "diff"; $("review-pane").querySelector(".actions").after(box); }
  const title = document.createElement("h2");
  title.textContent = path ? `diff · ${path}` : "diff · 全部变更";
  const pre = document.createElement("pre");
  pre.innerHTML = diffHtml(text);
  box.replaceChildren(title, pre);
  box.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function fileCardHtml(f) {
  let a = 0, d = 0;
  for (const h of f.hunks) for (const l of h.lines) {
    if (l.t === "+") a++;
    else if (l.t === "-") d++;
  }
  const head = `<div class="diffhead"><span class="path">${esc(f.path)}</span><span class="st"><span class="p">+${a}</span> <span class="m">−${d}</span></span></div>`;
  if (f.binary) {
    return `<div class="fileblock" data-file="${esc(f.path)}">${head}<div class="diffcard"><div class="meta" style="padding:8px 12px">二进制文件 — 不支持行级操作</div></div></div>`;
  }
  const rows = f.hunks.map((h) =>
    `<div class="hunkband">${esc(h.header)}</div>` +
    h.lines.map((l) => {
      const revert = l.t === " " || l.nn == null ? "" :
        `<button class="rv" data-kind="${l.t === "+" ? "add" : "del"}" data-line="${l.nn}" data-path="${esc(f.path)}" data-text="${esc(l.text)}" title="回退此行">↩</button>`;
      const cls = l.t === "+" ? "add" : l.t === "-" ? "del" : "ctx";
      return `<div class="dl ${cls}"><span class="ln">${l.n ?? ""}</span><span class="ln">${l.t === "-" ? "" : (l.nn ?? "")}</span><i class="sign">${esc(l.t)}</i><span class="code">${hi(l.text, langOf(f.path))}</span>${revert}</div>`;
    }).join("")
  ).join("");
  return `<div class="fileblock" data-file="${esc(f.path)}">${head}<div class="diffcard"><div class="diffbody">${rows}</div></div></div>`;
}

function renderWsView() {
  const files = wsViewPath ? wsModel.files.filter((f) => f.path === wsViewPath) : wsModel.files;
  const nav = `<div class="diffnav">
      <span class="cur">${wsViewPath ? esc(wsViewPath) : `全部变更（${wsModel.files.length} 个文件）`}</span>
      ${wsViewPath ? `<button class="btn" onclick="showWorkspaceDiff()">← 全部文件</button>` : ""}
      <button class="btn" onclick="reloadWsDiff()">⟳ 重新加载</button>
    </div>`;
  $("log").innerHTML = nav + (files.length
    ? files.map(fileCardHtml).join("")
    : wsViewPath
      ? `<div class="empty">该文件没有文本 diff —— 可能是空文件、目录或仅元数据变更</div>`
      : `<div class="empty ok">✓ 没有待提交的变更</div>`);
}
async function ensureWsModel(force) {
  if (force || !wsModel || Date.now() - wsModel.atClient > WS_TTL) {
    const data = await api("/api/workspace-diff?refresh=1");
    wsModel = { files: data.files ?? [], atClient: Date.now() };
    renderChanges(); // sidebar +/- stats come from the model
  }
}

async function showWorkspaceDiff(path) {
  wsViewPath = path ?? null;
  wsDiffOpen = true;
  $("review-pane").style.display = "none";
  $("home").style.display = "block";
  $("home-title").textContent = "工作区 diff";
  $("log").classList.remove("card");
  $("log").innerHTML = `<span class="spin">加载 diff…</span>`;
  try {
    await ensureWsModel(false);
    if (wsDiffOpen) renderWsView();
  } catch (e) {
    banner(String(e.message || e), false);
    backHome();
  }
}

async function reloadWsDiff() {
  if (!wsDiffOpen) return;
  $("log").innerHTML = `<span class="spin">加载 diff…</span>`;
  try {
    await ensureWsModel(true);
    if (wsDiffOpen) renderWsView();
  } catch (e) { banner(String(e.message || e), false); }
}

async function revertLine(btn) {
  const { kind, line, text, path } = btn.dataset;
  btn.disabled = true;
  try {
    const res = await api("/api/revert-line", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path, kind, line: Number(line), text }),
    });
    if (res.stale) {
      // Disk reverted but the server had no model to mirror into (e.g. it
      // restarted after page load) — wait out dv's sync lag, then reload.
      toast("已回退 1 行 — 等待 dv 同步后重载…");
      setTimeout(() => reloadWsDiff(), 3000);
      return;
    }
    const files = wsModel.files;
    const i = files.findIndex((f) => f.path === path);
    if (res.file) {
      if (i >= 0) files[i] = res.file;
      else files.push(res.file);
    } else if (i >= 0) files.splice(i, 1);
    wsModel.atClient = Date.now();
    const block = document.querySelector(`.fileblock[data-file="${CSS.escape(path)}"]`);
    if (block) {
      block.outerHTML = res.file
        ? fileCardHtml(res.file)
        : `<div class="fileblock"><div class="empty ok">✓ ${esc(path)} 的变更已全部回退</div></div>`;
    } else {
      renderWsView();
    }
    renderChanges();
    toast("已回退 1 行");
  } catch (e) {
    if (e.stale) {
      // Model disagreed with the request — reload the truth from dv.
      toast("模型已过期 — 正在重新加载 diff");
      reloadWsDiff();
    } else {
      banner(String(e.message || e), false);
      btn.disabled = false;
    }
  }
}

document.addEventListener("click", (ev) => {
  const b = ev.target.closest("button.rv");
  if (b) { revertLine(b); return; }
  const row = ev.target.closest(".file-row[data-path]");
  if (row) { showWorkspaceDiff(row.dataset.path); return; }
  const rrow = ev.target.closest(".file-row[data-rpath]");
  if (rrow) showDiff(rrow.dataset.rpath);
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && ev.target.classList?.contains("file-row")) ev.target.click();
});

async function act(action) {
  if (!currentId) return;
  if (action === "merge" && !confirm(`确认把 ${currentReview.compare_ref} 合并到 ${currentReview.base_ref}？`)) return;
  try {
    const res = await api("/api/action", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: currentId, action }),
    });
    banner(`${action} 成功` + (res.output ? `\n${res.output}` : ""), true);
    await loadReviews();
    if (action === "merge" || action === "close") backHome();
    else await openReview(currentId);
  } catch (e) { banner(String(e.message || e), false); }
}

function backHome() {
  wsDiffOpen = false;
  $("review-pane").style.display = "none";
  $("home").style.display = "block";
  $("home-title").textContent = "提交历史";
  $("log").classList.add("card");
  if (lastState) renderState(lastState);
}

async function postComment() {
  const text = $("newcomment").value.trim();
  if (!text) return;
  try {
    await api("/api/action", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: currentId, action: "comment", content: text }),
    });
    $("newcomment").value = "";
    await openReview(currentId);
  } catch (e) { banner(String(e.message || e), false); }
}

async function promptNewReview() {
  const title = prompt("Review 标题：");
  if (!title) return;
  try {
    const res = await api("/api/new-review", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title }),
    });
    banner(res.output || "review 已发起", res.ok);
    await loadReviews();
  } catch (e) { banner(String(e.message || e), false); }
}

async function refreshAll() {
  banner("");
  try {
    const state = await api("/api/state");
    if (state.version !== SERVER_VERSION) {
      banner(`界面（${SERVER_VERSION}）与服务端（${state.version ?? "旧版"}）版本不一致 —— 端口 ${location.port} 上有旧实例在运行。请完全退出后重新启动（Zed 里再按一次快捷键无效时，先杀掉占用进程）。`);
    }
    renderState(state);
  } catch (e) { banner(String(e.message || e), false); }
  // Reviews need the optional REST token — never let them block state.
  loadReviews().catch((e) => {
    const msg = String(e.message || e);
    const short = msg.startsWith("The Diversion REST API needs") ? "未配置 API token — review 功能不可用" : msg;
    $("reviews").innerHTML = `<div class="empty" title="${esc(msg)}">${esc(short)}</div>`;
  });
  if (wsDiffOpen) reloadWsDiff();
}

refreshAll();
document.addEventListener("keydown", (ev) => {
  if (ev.key.toLowerCase() === "r" && !ev.ctrlKey && !ev.altKey && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) refreshAll();
});
</script>
